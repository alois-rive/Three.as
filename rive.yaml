# ThreeAS: three.js for Rive (AnimaScript + GPUCanvas). See README.md.
name: three_as
main: Gallery
scripting: wasm

exclude:
  - build
  - tools
  - docs
  - "*.md"
  - "**/*.md"
  # The gallery (rive . --artboard=Gallery): its generator and font licences
  # are not sources.
  - "gallery/*.py"
  - "gallery/fonts/*.txt"

# Test suites run with `rive . --test` and never ship.
excludeFromRev:
  scripts:
    - "tests/*"

logs:
  file: build/rive.log
  problems: build/problems.log
pages:
  workspaceId: 40887
  name: "threeas"
push:
  projectId: 44599
  fileId: 38626
