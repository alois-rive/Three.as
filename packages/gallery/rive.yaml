# The ThreeAS gallery: the landing page and every example, built on the
# engine in ../threeas. See ../../README.md.
name: three_as
main: Gallery
scripting: wasm

exclude:
  - build
  - tools
  - "*.md"
  - "**/*.md"
  # The gallery's generator and font licences are not sources.
  - "gallery/*.py"
  - "gallery/fonts/*.txt"

logs:
  file: build/rive.log
  problems: build/problems.log
pages:
  workspaceId: 40887
  name: "threeas"
push:
  projectId: 44599
  fileId: 38626

# The engine, as the UAT library "threeas" (file 38630, library 761). The
# examples import it as "lib:threeas/three/...". fileId, libraryId and
# version are the tool's (rive library add/update/pull write them).
libraries:
  "threeas":
    fileId: 38630
    libraryId: 761
    version: 11
    # Build against the engine sources next door instead of the published
    # snapshot in .libraries/, so engine edits show without republishing.
    # Only honoured while ../threeas/rive.yaml pushes to this fileId (its
    # UAT binding, see tools/publish.sh); otherwise the build warns and
    # uses .libraries/.
    override: ../threeas
