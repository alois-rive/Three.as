# The ThreeAS gallery: the landing page and every example, built on the
# engine in ../threeas. See ../../README.md.
name: three_as
main: Gallery
scripting: wasm

exclude:
  - build
  - tools
  - "*.md"
  - "**/*.md"
  # The gallery's generator and font licences are not sources.
  - "gallery/*.py"
  - "gallery/fonts/*.txt"

logs:
  file: build/rive.log
  problems: build/problems.log
pages:
  workspaceId: 40887
  name: "threeas"
push:
  fileId: 2754626
  projectId: 2062040

# The engine, as the production library "threeas" (file 2738936, library
# 5221, project 2062040). The examples import it as "lib:threeas/three/...".
# fileId, libraryId and version are the tool's (rive library add/update/pull
# write them).
libraries:
  "threeas":
    fileId: 2738936
    libraryId: 5221
    version: 10
    # Build against the engine sources next door instead of the published
    # snapshot in .libraries/, so engine edits show without republishing.
    # Only honoured while ../threeas/rive.yaml pushes to this fileId (its
    # production binding, see tools/publish.sh); otherwise the build warns
    # and uses .libraries/.
    override: ../threeas
