# ThreeAS, the engine: three.js for Rive, published as a Rive library.
# See ../../README.md and ../../AGENTS.md.
name: threeas
scripting: wasm

exclude:
  - build
  - tools
  - bindings
  - "*.md"
  - "**/*.md"

# Test suites (tests/*_test.as; a script's name is its file stem) run with
# `rive . --test` and are not published with the library.
excludeFromRev:
  scripts:
    - "*_test"

logs:
  file: build/rive.log
  problems: build/problems.log

# The library file this project publishes to: production's "threeas"
# (library 5221, file 2738936 in project 2062040 "Rive Public Libraries"),
# as bindings/prod.yaml has it. Keep the production binding here: the
# gallery imports that library, and its library override needs this
# project to push to the same file. tools/publish.sh --env=uat swaps in
# bindings/uat.yaml for a UAT publish and puts this back.
push:
  projectId: 2062040
  fileId: 2738936
