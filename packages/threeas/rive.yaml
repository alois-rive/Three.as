# ThreeAS, the engine: three.js for Rive, published as a Rive library.
# See ../../README.md and ../../AGENTS.md.
name: threeas
scripting: wasm

exclude:
  - build
  - tools
  - bindings
  - "*.md"
  - "**/*.md"

# Test suites (tests/*_test.as; a script's name is its file stem) run with
# `rive . --test` and are not published with the library.
excludeFromRev:
  scripts:
    - "*_test"

logs:
  file: build/rive.log
  problems: build/problems.log

# The library file this project publishes to: UAT's "threeas" (library 761),
# as bindings/uat.yaml has it. Keep the UAT binding here: the gallery's
# library override needs it. tools/publish.sh --env=prod swaps in
# bindings/prod.yaml for a production publish and puts this back.
push:
  projectId: 44599
  fileId: 38630
